name: Deploy to GitHub Pages

on:
    push:
        branches: ["main"]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 20
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Load secrets from 1Password
              uses: 1password/load-secrets-action@v2
              with:
                  export-env: true
              env:
                  OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
                  VITE_SUPABASE_URL: op://swing-dance-moves/Supabase/url
                  VITE_SUPABASE_ANON_KEY: op://swing-dance-moves/Supabase/anon-key

            - name: Security audit (production dependencies)
              run: npm run audit

            - name: Spell check
              run: npm run spellcheck

            - name: Lint JavaScript and Svelte
              run: npm run lint:js

            - name: Lint CSS
              run: npm run lint:css

            - name: Type check
              run: npm run check

            - name: Unit tests
              run: npm run test

            - name: Build
              run: npm run build
              env:
                  BASE_PATH: "/${{ github.event.repository.name }}"

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: frontend/build

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
