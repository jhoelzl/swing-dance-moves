version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    rebase-strategy: disabled
    labels:
      - dependencies
    groups:
      # One PR per week with all minor/patch updates (dev + prod together),
      # so the lockfile is resolved once and peer conflicts show up in one place.
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Security fixes (incl. transitive deps like brace-expansion, devalue)
      # are batched into one PR instead of one PR per package.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    # Major bumps stay as separate PRs (not grouped) so breaking changes are
    # reviewed on their own and cannot block the weekly minor/patch PR.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    rebase-strategy: disabled
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
